[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "macos-harness"
version = "0.2.1"
description = "The simplest, thinnest harness that gives an LLM complete freedom to control a Mac."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
keywords = ["agent", "automation", "computer-use", "macos", "accessibility", "cdp"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: MacOS X",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Operating System :: MacOS",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Desktop Environment",
  "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
  "pyobjc-framework-ApplicationServices>=12.0; sys_platform == 'darwin'",
  "pyobjc-framework-Cocoa>=12.0; sys_platform == 'darwin'",
  "pyobjc-framework-Quartz>=12.0; sys_platform == 'darwin'",
]

[dependency-groups]
dev = [
  "pillow>=11.3",
  "pytest>=8.4",
  "pyyaml>=6.0",
  "ruff>=0.12",
]

[project.scripts]
macos-harness = "macos_harness.cli:main"

[project.urls]
Homepage = "https://github.com/browser-use/macos-harness"
Repository = "https://github.com/browser-use/macos-harness"
Issues = "https://github.com/browser-use/macos-harness/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/macos_harness"]

[tool.hatch.build.targets.wheel.force-include]
"skills/macos-harness/SKILL.md" = "macos_harness/SKILL.md"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "live: drives a real app on this Mac. Runs only with MACOS_HARNESS_LIVE=1.",
]
