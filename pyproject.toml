[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "macos-harness"
version = "0.1.2"
description = "The simplest, thinnest harness that gives an LLM complete freedom to control a Mac."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
keywords = ["agent", "automation", "computer-use", "macos", "accessibility", "cdp"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: MacOS X",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Operating System :: MacOS",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Desktop Environment",
  "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
  "browser-harness>=0.1.9",
  "pillow>=11.3",
  "pyobjc-framework-ApplicationServices>=12.0; sys_platform == 'darwin'",
]

[dependency-groups]
dev = [
  "pytest>=8.4",
  "pyyaml>=6.0",
  "ruff>=0.12",
]

[project.scripts]
macos-harness = "macos_harness.cli:main"

[project.urls]
Homepage = "https://github.com/browser-use/macos-harness"
Repository = "https://github.com/browser-use/macos-harness"
Issues = "https://github.com/browser-use/macos-harness/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/macos_harness"]
artifacts = ["src/macos_harness/bin/macos-harness-agent"]

[tool.hatch.build.targets.wheel.hooks.custom]

[tool.hatch.build.targets.wheel.force-include]
"skills/macos-harness/SKILL.md" = "macos_harness/SKILL.md"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "native: exercises the Swift native agent; skipped without the toolchain or a trusted, reachable agent",
  "smoke: local-only end-to-end smoke check against a live macOS session",
]
