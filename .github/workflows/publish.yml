name: Publish

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  build:
    if: github.repository == 'browser-use/macos-harness'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Verify the release tag matches the package version
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: python3 scripts/check_release_tag.py "$RELEASE_TAG"
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
        with:
          python-version: "3.12"
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run pytest -m "not native"
      - run: swift test
        working-directory: native/macos-harness-agent
      - run: scripts/build-universal-agent.sh
      - run: uv build --sdist --wheel
      - name: Verify exactly one universal2 wheel was built from source
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          matches=(dist/*-py3-none-macosx_*_universal2.whl)
          if [[ ${#matches[@]} -ne 1 ]]; then
            echo "expected exactly one *-py3-none-macosx_*_universal2.whl in dist/, found ${#matches[@]}: ${matches[*]}" >&2
            exit 1
          fi
          echo "verified universal2 wheel: ${matches[0]}"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: dist
          path: dist/
      - name: Verify exactly one universal2 wheel was downloaded
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          matches=(dist/*-py3-none-macosx_*_universal2.whl)
          if [[ ${#matches[@]} -ne 1 ]]; then
            echo "expected exactly one *-py3-none-macosx_*_universal2.whl in dist/, found ${#matches[@]}: ${matches[*]}" >&2
            exit 1
          fi
          echo "verified universal2 wheel: ${matches[0]}"
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
