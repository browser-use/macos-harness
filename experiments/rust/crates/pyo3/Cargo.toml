[package]
name = "macos-harness-pyo3"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
description = "PyO3 bindings exposing macos-harness-core to Python as macos_harness_rs"

[lib]
name = "macos_harness_rs"
crate-type = ["cdylib", "rlib"]

[dependencies]
macos-harness-core = { path = "../core" }
pyo3 = { version = "0.23", features = ["extension-module"] }

[build-dependencies]
pyo3-build-config = "0.23"
